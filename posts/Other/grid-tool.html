<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖片方格填充工具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #12141a;
  color: #d8d8e8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: #1a1d27;
  padding: 0.9rem 1.5rem;
  border-bottom: 2px solid #2a2f45;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

header h1 {
  font-size: 1.2rem;
  color: #7eb8f7;
  font-weight: 600;
  flex: 1;
}

.btn-new-tab {
  background: transparent;
  border: 1px solid #2a2f45;
  border-radius: 6px;
  color: #8888a8;
  padding: 0.35rem 0.75rem;
  font-size: 0.78rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  white-space: nowrap;
  transition: border-color 0.18s, color 0.18s;
  text-decoration: none;
}

.btn-new-tab:hover {
  border-color: #7eb8f7;
  color: #7eb8f7;
}

.main {
  display: flex;
  flex: 1;
  overflow: hidden;
  height: calc(100vh - 52px);
}

/* ── Controls panel ── */
.controls {
  width: 270px;
  flex-shrink: 0;
  background: #1a1d27;
  border-right: 1px solid #2a2f45;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.section {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.section-title {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #7eb8f7;
  padding-bottom: 0.3rem;
  border-bottom: 1px solid #2a2f45;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.field label {
  font-size: 0.78rem;
  color: #8888a8;
}

.field input[type="number"] {
  background: #11131c;
  border: 1px solid #2a2f45;
  border-radius: 6px;
  color: #d8d8e8;
  padding: 0.38rem 0.6rem;
  font-size: 0.88rem;
  width: 100%;
  transition: border-color 0.18s;
}

.field input[type="number"]:focus {
  outline: none;
  border-color: #7eb8f7;
}

.row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
}

/* Color + opacity group */
.color-group {
  display: flex;
  gap: 0.5rem;
  align-items: flex-end;
}

.color-group input[type="color"] {
  width: 44px;
  height: 36px;
  padding: 2px 3px;
  border: 1px solid #2a2f45;
  border-radius: 6px;
  background: #11131c;
  cursor: pointer;
  flex-shrink: 0;
}

.opacity-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.opacity-wrap span {
  font-size: 0.75rem;
  color: #8888a8;
}

input[type="range"] {
  width: 100%;
  accent-color: #7eb8f7;
  cursor: pointer;
}

select {
  background: #11131c;
  border: 1px solid #2a2f45;
  border-radius: 6px;
  color: #d8d8e8;
  padding: 0.38rem 0.6rem;
  font-size: 0.85rem;
  width: 100%;
  cursor: pointer;
}

select:focus { outline: none; border-color: #7eb8f7; }

/* toggle switch */
.toggle-row {
  flex-direction: row !important;
  align-items: center;
  gap: 0.6rem;
  cursor: pointer;
}

.toggle-row input[type="checkbox"] { display: none; }

.toggle-switch {
  position: relative;
  width: 36px;
  height: 20px;
  background: #2a2f45;
  border-radius: 10px;
  flex-shrink: 0;
  transition: background 0.2s;
}

.toggle-switch::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  background: #fff;
  border-radius: 50%;
  top: 3px; left: 3px;
  transition: left 0.18s;
}

.toggle-row input[type="checkbox"]:checked + .toggle-switch {
  background: #7eb8f7;
}

.toggle-row input[type="checkbox"]:checked + .toggle-switch::after {
  left: 19px;
}

.toggle-label {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.83rem;
  color: #c0c0d8;
  cursor: pointer;
  user-select: none;
}

.binarize-opts {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  padding: 0.5rem 0 0 0;
}

/* Upload */
.upload-area {
  border: 2px dashed #2a2f45;
  border-radius: 8px;
  padding: 1.2rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.18s;
  background: #11131c;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
}

.upload-area:hover,
.upload-area.drag-over {
  border-color: #7eb8f7;
  background: #171c2c;
}

.upload-area input { display: none; }
.upload-icon { font-size: 1.8rem; }
.upload-text { font-size: 0.78rem; color: #6868a0; }
.upload-name { font-size: 0.78rem; color: #7eb8f7; word-break: break-all; }

hr.sep {
  border: none;
  border-top: 1px solid #2a2f45;
}

.btn-download {
  background: #3a6fd4;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 0.6rem 1rem;
  cursor: pointer;
  font-size: 0.88rem;
  width: 100%;
  transition: background 0.18s;
  font-weight: 600;
}

.btn-download:hover:not(:disabled) { background: #2a5bbf; }
.btn-download:disabled { background: #2a2f45; color: #555; cursor: not-allowed; }

.btn-auto {
  background: #162a1a;
  color: #5de87a;
  border: 1px solid #2a5a35;
  border-radius: 6px;
  padding: 0.6rem 1rem;
  cursor: pointer;
  font-size: 0.88rem;
  width: 100%;
  transition: background 0.18s, border-color 0.18s;
  font-weight: 600;
}

.btn-auto:hover:not(:disabled) { background: #1e3d23; border-color: #3d8a4a; }
.btn-auto:disabled { background: #2a2f45; color: #555; border-color: #2a2f45; cursor: not-allowed; }

.btn-canvas-fit {
  background: #121e30;
  color: #5db8e8;
  border: 1px solid #2a4a6a;
  border-radius: 6px;
  padding: 0.6rem 1rem;
  cursor: pointer;
  font-size: 0.88rem;
  width: 100%;
  transition: background 0.18s, border-color 0.18s;
  font-weight: 600;
}

.btn-canvas-fit:hover:not(:disabled) { background: #1a2e45; border-color: #3a6a9a; }
.btn-canvas-fit:disabled { background: #2a2f45; color: #555; border-color: #2a2f45; cursor: not-allowed; }

.auto-hint {
  font-size: 0.72rem;
  color: #555570;
  text-align: center;
  line-height: 1.4;
}

/* ── Canvas area ── */
.canvas-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.canvas-toolbar {
  background: #1a1d27;
  border-bottom: 1px solid #2a2f45;
  padding: 0.5rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.78rem;
  color: #6868a0;
  flex-shrink: 0;
}

.badge {
  background: #11131c;
  border: 1px solid #2a2f45;
  border-radius: 4px;
  padding: 0.15rem 0.5rem;
  color: #9090b8;
  font-size: 0.74rem;
}

.zoom-controls {
  display: none;
  align-items: center;
  gap: 0.3rem;
  margin-left: auto;
}

.zoom-btn {
  background: #11131c;
  border: 1px solid #2a2f45;
  border-radius: 4px;
  color: #9090b8;
  width: 20px;
  height: 20px;
  padding: 0;
  cursor: pointer;
  font-size: 0.9rem;
  line-height: 1;
  transition: border-color 0.18s, color 0.18s;
}

.zoom-btn:hover { border-color: #7eb8f7; color: #7eb8f7; }

#zoomBadge { min-width: 3.2rem; text-align: center; }

.canvas-scroll {
  flex: 1;
  overflow: auto;
  padding: 1.5rem;
  background: #0d0f16;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
}

.placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #333350;
  gap: 0.75rem;
}

.placeholder-icon { font-size: 3rem; }
.placeholder-text { font-size: 0.95rem; }

canvas {
  display: block;
  border-radius: 4px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  image-rendering: pixelated;
}

/* ── Context Menu ── */
#ctxMenu {
  position: fixed;
  z-index: 2000;
  background: #1e2130;
  border: 1px solid #3a3f58;
  border-radius: 6px;
  padding: 0.3rem 0;
  min-width: 150px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.55);
  display: none;
}

.ctx-item {
  padding: 0.5rem 1rem;
  font-size: 0.83rem;
  cursor: pointer;
  color: #c8c8e0;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  transition: background 0.12s;
  user-select: none;
}

.ctx-item:hover { background: #2a2f48; }
.ctx-item.danger { color: #e87070; }
.ctx-item.danger:hover { background: #3a2020; }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 3000;
  background: rgba(0,0,0,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-box {
  background: #1a1d27;
  border: 1px solid #3a3f58;
  border-radius: 10px;
  width: 340px;
  max-width: 95vw;
  box-shadow: 0 16px 48px rgba(0,0,0,0.7);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-header {
  background: #141720;
  padding: 0.85rem 1.1rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  border-bottom: 1px solid #2a2f45;
}

.modal-title {
  font-size: 0.95rem;
  font-weight: 600;
  color: #7eb8f7;
  flex: 1;
}

.modal-cell-badge {
  font-size: 0.74rem;
  color: #9090b8;
  background: #11131c;
  border: 1px solid #2a2f45;
  border-radius: 4px;
  padding: 0.15rem 0.5rem;
}

.modal-close {
  background: none;
  border: none;
  color: #6868a0;
  font-size: 1.2rem;
  cursor: pointer;
  padding: 0.1rem 0.3rem;
  border-radius: 4px;
  line-height: 1;
  transition: color 0.15s;
}

.modal-close:hover { color: #d8d8e8; }

.modal-body {
  padding: 1rem 1.1rem;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  max-height: 60vh;
  overflow-y: auto;
}

.modal-section-title {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #7eb8f7;
  padding-bottom: 0.3rem;
  border-bottom: 1px solid #2a2f45;
}

.modal-row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
}

.modal-footer {
  padding: 0.8rem 1.1rem;
  display: flex;
  gap: 0.6rem;
  justify-content: flex-end;
  border-top: 1px solid #2a2f45;
}

.btn-modal-apply {
  background: #3a6fd4;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 0.5rem 1.2rem;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  transition: background 0.18s;
}

.btn-modal-apply:hover { background: #2a5bbf; }

.btn-modal-cancel {
  background: #11131c;
  color: #9090b8;
  border: 1px solid #2a2f45;
  border-radius: 6px;
  padding: 0.5rem 1.2rem;
  cursor: pointer;
  font-size: 0.85rem;
  transition: background 0.18s, color 0.18s;
}

.btn-modal-cancel:hover { background: #1a1d27; color: #d8d8e8; }

.orient-btns {
  display: flex;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #2a2f45;
}

.orient-btn {
  flex: 1;
  background: #11131c;
  border: none;
  color: #9090b8;
  padding: 0.42rem 0;
  font-size: 0.82rem;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  user-select: none;
}

.orient-btn + .orient-btn { border-left: 1px solid #2a2f45; }
.orient-btn.active { background: #253560; color: #7eb8f7; font-weight: 600; }
.orient-btn:hover:not(.active) { background: #1a1d27; color: #d8d8e8; }

.scale-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.scale-row input[type="range"] { flex: 1; }

.scale-row input[type="number"] {
  background: #11131c;
  border: 1px solid #2a2f45;
  border-radius: 6px;
  color: #d8d8e8;
  padding: 0.3rem 0.4rem;
  font-size: 0.85rem;
  width: 54px;
  text-align: center;
}

.scale-row input[type="number"]:focus { outline: none; border-color: #7eb8f7; }

.canvas-subsection {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #5a6080;
  padding-top: 0.3rem;
  border-top: 1px solid #222538;
}
</style>
</head>
<body>

<header>
  <span style="font-size:1.3rem">🔲</span>
  <h1>圖片方格填充工具</h1>
  <a class="btn-new-tab" href="" target="_blank" id="newTabBtn" title="在新分頁開啟完整頁面">
    <span>⧉</span> 新分頁開啟
  </a>
</header>

<div class="main">

  <!-- ── Controls ── -->
  <div class="controls">

    <!-- Upload -->
    <div class="section">
      <div class="section-title">圖片上傳</div>
      <label class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*">
        <div class="upload-icon">🖼️</div>
        <div class="upload-text" id="uploadText">點擊或拖曳圖片到此</div>
      </label>
    </div>

    <hr class="sep">

    <!-- Canvas settings -->
    <div class="section">
      <div class="section-title">畫布設定</div>
      <div class="field toggle-row">
        <label class="toggle-label">
          <input type="checkbox" id="canvasModeOn">
          <span class="toggle-switch"></span>
          啟用畫布模式
        </label>
      </div>
      <div id="canvasModeOpts" style="display:none;flex-direction:column;gap:0.6rem;">
        <div class="row2">
          <div class="field">
            <label>寬度 (cm)</label>
            <input type="number" id="canvasW" value="21" min="0.1" max="500" step="0.1">
          </div>
          <div class="field">
            <label>高度 (cm)</label>
            <input type="number" id="canvasH" value="29.7" min="0.1" max="500" step="0.1">
          </div>
        </div>
        <div class="field">
          <label>方向</label>
          <div class="orient-btns">
            <button class="orient-btn active" id="orientPortrait">↕ 直式</button>
            <button class="orient-btn" id="orientLandscape">↔ 橫式</button>
          </div>
        </div>
        <div class="field">
          <label>解析度</label>
          <select id="canvasDpi">
            <option value="72">72 DPI（螢幕低）</option>
            <option value="96">96 DPI（螢幕）</option>
            <option value="150">150 DPI（一般列印）</option>
            <option value="300" selected>300 DPI（高品質列印）</option>
            <option value="custom">自訂…</option>
          </select>
        </div>
        <div class="field" id="customDpiField" style="display:none">
          <label>自訂 DPI</label>
          <input type="number" id="customDpiVal" value="96" min="1" max="2400">
        </div>
        <div class="field">
          <label>背景色</label>
          <input type="color" id="canvasBg" value="#ffffff" style="width:100%;height:34px;padding:2px 3px;border:1px solid #2a2f45;border-radius:6px;background:#11131c;cursor:pointer;">
        </div>
        <div class="field">
          <label>圖片配置</label>
          <select id="canvasFit">
            <option value="fit">置中符合（保持比例）</option>
            <option value="fill">填滿裁切（保持比例）</option>
            <option value="stretch">延伸填滿</option>
            <option value="original">原始大小置中</option>
          </select>
        </div>
        <div class="canvas-subsection">圖片大小與位置</div>
        <div class="field">
          <label>縮放比例</label>
          <div class="scale-row">
            <input type="range" id="canvasImgScale" value="100" min="10" max="300" step="1">
            <input type="number" id="canvasImgScaleNum" value="100" min="10" max="300">
            <span style="font-size:0.78rem;color:#6868a0;">%</span>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>位移 X (px)</label>
            <input type="number" id="canvasOffsetX" value="0" step="1">
          </div>
          <div class="field">
            <label>位移 Y (px)</label>
            <input type="number" id="canvasOffsetY" value="0" step="1">
          </div>
        </div>
        <span class="badge" id="canvasPxBadge" style="text-align:center;padding:0.3rem 0.5rem;">2480 × 3508 px</span>
      </div>
    </div>

    <hr class="sep">

    <!-- Auto fit -->
    <div class="section">
      <button class="btn-auto" id="autoFitBtn" disabled>⚡ 上傳圖片一鍵調整網格</button>
      <button class="btn-canvas-fit" id="autoFitCanvasBtn" disabled>⚡ 畫布一鍵調整網格</button>
      <div class="auto-hint">依比例自動計算最佳邊長與欄列數（最多 40 格）</div>
    </div>

    <hr class="sep">

    <!-- Binarize -->
    <div class="section">
      <div class="section-title">二值化</div>
      <div class="field toggle-row">
        <label class="toggle-label">
          <input type="checkbox" id="binarizeOn">
          <span class="toggle-switch"></span>
          啟用二值化
        </label>
      </div>
      <div class="binarize-opts" id="binarizeOpts" style="display:none">
        <div class="field">
          <label>臨界值 (0–255): <strong id="thresholdVal">128</strong></label>
          <input type="range" id="threshold" value="128" min="0" max="255">
        </div>
        <div class="field">
          <label>灰階公式</label>
          <select id="grayMethod">
            <option value="luma">亮度加權 0.299R+0.587G+0.114B</option>
            <option value="avg">平均值 (R+G+B)/3</option>
            <option value="max">最大值 max(R,G,B)</option>
          </select>
        </div>
      </div>
    </div>

    <hr class="sep">

    <!-- Square size -->
    <div class="section">
      <div class="section-title">正方形大小</div>
      <div class="field">
        <label>邊長 (px)</label>
        <input type="number" id="size" value="60" min="1" max="2000">
      </div>
    </div>

    <hr class="sep">

    <!-- Grid count -->
    <div class="section">
      <div class="section-title">網格數量</div>
      <div class="row2">
        <div class="field">
          <label>X 軸 (欄數)</label>
          <input type="number" id="xCount" value="5" min="1" max="500">
        </div>
        <div class="field">
          <label>Y 軸 (列數)</label>
          <input type="number" id="yCount" value="5" min="1" max="500">
        </div>
      </div>
    </div>

    <hr class="sep">

    <!-- Border -->
    <div class="section">
      <div class="section-title">邊框</div>
      <div class="field">
        <label>邊框寬度 (px)</label>
        <input type="number" id="borderWidth" value="2" min="0" max="100">
      </div>
      <div class="field">
        <label>邊框顏色 &amp; 透明度</label>
        <div class="color-group">
          <input type="color" id="borderColor" value="#ff3333">
          <div class="opacity-wrap">
            <span>透明度: <strong id="borderOpacityVal">100</strong>%</span>
            <input type="range" id="borderOpacity" value="100" min="0" max="100">
          </div>
        </div>
      </div>
    </div>

    <hr class="sep">

    <!-- Fill -->
    <div class="section">
      <div class="section-title">填充色</div>
      <div class="field">
        <label>填充顏色 &amp; 透明度</label>
        <div class="color-group">
          <input type="color" id="fillColor" value="#ff3333">
          <div class="opacity-wrap">
            <span>透明度: <strong id="fillOpacityVal">20</strong>%</span>
            <input type="range" id="fillOpacity" value="20" min="0" max="100">
          </div>
        </div>
      </div>
    </div>

    <hr class="sep">

    <!-- Start position -->
    <div class="section">
      <div class="section-title">起點位置</div>
      <div class="row2">
        <div class="field">
          <label>起點 X (px)</label>
          <input type="number" id="startX" value="0">
        </div>
        <div class="field">
          <label>起點 Y (px)</label>

<script>
// 設定新分頁按鈕指向自身頁面（在 iframe 內時使用 document.location）
document.getElementById('newTabBtn').href = window.location.href;

const canvas    = document.getElementById('canvas');
const ctx       = canvas.getContext('2d');
const placeholder  = document.getElementById('placeholder');
const downloadBtn  = document.getElementById('downloadBtn');
const sizeInfo     = document.getElementById('sizeInfo');
const gridBadge    = document.getElementById('gridBadge');
const uploadText   = document.getElementById('uploadText');
const uploadArea   = document.getElementById('uploadArea');

let imgEl = null;
let zoomLevel = 100;

const zoomControls = document.getElementById('zoomControls');
const zoomBadge    = document.getElementById('zoomBadge');

function applyZoom() {
  const scale = zoomLevel / 100;
  canvas.style.width  = `${canvas.width  * scale}px`;
  canvas.style.height = `${canvas.height * scale}px`;
  zoomBadge.textContent = `${zoomLevel}%`;
}

document.getElementById('zoomIn').addEventListener('click', () => {
  const steps = [25, 50, 75, 100, 125, 150, 200, 300, 400];
  const next = steps.find(s => s > zoomLevel);
  if (next) { zoomLevel = next; applyZoom(); }
});

document.getElementById('zoomOut').addEventListener('click', () => {
  const steps = [25, 50, 75, 100, 125, 150, 200, 300, 400];
  const prev = [...steps].reverse().find(s => s < zoomLevel);
  if (prev) { zoomLevel = prev; applyZoom(); }
});

// ─── auto fit ──────────────────────────────────────────────
function calcBestGrid(W, H) {
  let bestX = 5, bestY = 5, bestS = Math.round(Math.min(W, H) / 5);
  let bestScore = Infinity;

  for (let x = 1; x <= 40; x++) {
    for (let y = 1; x * y <= 40; y++) {
      const sLo = Math.floor(Math.min(W / x, H / y));
      const sHi = Math.ceil(Math.max(W / x, H / y));

      for (let s = Math.max(1, sLo); s <= sHi; s++) {
        const covX = (x * s) / W;
        const covY = (y * s) / H;
        const underX = Math.max(0, 1 - covX);
        const underY = Math.max(0, 1 - covY);
        const overX  = Math.max(0, covX - 1);
        const overY  = Math.max(0, covY - 1);
        const score  = 2 * (underX + underY) + (overX + overY);

        if (score < bestScore) {
          bestScore = score;
          bestX = x; bestY = y; bestS = s;
        }
      }
    }
  }
  return { x: bestX, y: bestY, s: bestS };
}

function applyGrid(x, y, s) {
  document.getElementById('size').value   = s;
  document.getElementById('xCount').value = x;
  document.getElementById('yCount').value = y;
  render();
}

function autoFit() {
  if (!imgEl) return;
  const { x, y, s } = calcBestGrid(imgEl.naturalWidth, imgEl.naturalHeight);
  applyGrid(x, y, s);
}

function autoFitCanvas() {
  const wCm = parseFloat(document.getElementById('canvasW').value) || 21;
  const hCm = parseFloat(document.getElementById('canvasH').value) || 29.7;
  const dpi  = getEffectiveDpi();
  const W    = Math.max(1, Math.round(wCm * dpi / 2.54));
  const H    = Math.max(1, Math.round(hCm * dpi / 2.54));
  const { x, y, s } = calcBestGrid(W, H);
  applyGrid(x, y, s);
}

document.getElementById('autoFitBtn').addEventListener('click', autoFit);
document.getElementById('autoFitCanvasBtn').addEventListener('click', autoFitCanvas);

// ─── canvas mode events ────────────────────────────────────
document.getElementById('canvasModeOn').addEventListener('change', function() {
  document.getElementById('canvasModeOpts').style.display = this.checked ? 'flex' : 'none';
  document.getElementById('autoFitCanvasBtn').disabled = !this.checked;
  if (imgEl) render();
});

function syncOrientBtns() {
  const w = parseFloat(document.getElementById('canvasW').value) || 0;
  const h = parseFloat(document.getElementById('canvasH').value) || 0;
  document.getElementById('orientPortrait').classList.toggle('active', h >= w);
  document.getElementById('orientLandscape').classList.toggle('active', w > h);
}

function setOrientation(mode) {
  const wEl = document.getElementById('canvasW');
  const hEl = document.getElementById('canvasH');
  const w = parseFloat(wEl.value) || 21;
  const h = parseFloat(hEl.value) || 29.7;
  if (mode === 'portrait'  && w > h) { wEl.value = h; hEl.value = w; }
  if (mode === 'landscape' && h > w) { wEl.value = h; hEl.value = w; }
  syncOrientBtns();
  updateCanvasPxBadge();
  if (imgEl) render();
}

document.getElementById('orientPortrait').addEventListener('click',  () => setOrientation('portrait'));
document.getElementById('orientLandscape').addEventListener('click', () => setOrientation('landscape'));

document.getElementById('canvasImgScale').addEventListener('input', function() {
  document.getElementById('canvasImgScaleNum').value = this.value;
  if (imgEl) render();
});

document.getElementById('canvasImgScaleNum').addEventListener('input', function() {
  const v = Math.min(300, Math.max(10, parseFloat(this.value) || 100));
  document.getElementById('canvasImgScale').value = v;
  if (imgEl) render();
});

document.getElementById('canvasDpi').addEventListener('change', function() {
  document.getElementById('customDpiField').style.display = this.value === 'custom' ? '' : 'none';
  updateCanvasPxBadge();
  if (imgEl) render();
});

['canvasW', 'canvasH', 'customDpiVal', 'canvasBg', 'canvasFit', 'canvasOffsetX', 'canvasOffsetY'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    updateCanvasPxBadge();
    if (id === 'canvasW' || id === 'canvasH') syncOrientBtns();
    if (imgEl) render();
  });
});

// ─── sub-grid state ────────────────────────────────────────
const subGrids = new Map(); // key: "col,row" → { xCount, yCount, bw, bColor, bOpacity, fColor, fOpacity }
let ctxCol = -1, ctxRow = -1;

// ─── context menu ──────────────────────────────────────────
const ctxMenu = document.getElementById('ctxMenu');

function showCtxMenu(screenX, screenY, col, row) {
  ctxCol = col; ctxRow = row;
  document.getElementById('ctxClear').style.display = subGrids.has(`${col},${row}`) ? '' : 'none';
  ctxMenu.style.display = 'block';
  const mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
  ctxMenu.style.left = `${Math.min(screenX, window.innerWidth  - mw - 8)}px`;
  ctxMenu.style.top  = `${Math.min(screenY, window.innerHeight - mh - 8)}px`;
}

function hideCtxMenu() { ctxMenu.style.display = 'none'; }

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (!imgEl) return;
  const rect   = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx     = (e.clientX - rect.left) * scaleX;
  const cy     = (e.clientY - rect.top)  * scaleY;
  const size   = Math.max(1, numVal('size', 60));
  const xCount = Math.max(1, Math.round(numVal('xCount', 5)));
  const yCount = Math.max(1, Math.round(numVal('yCount', 5)));
  const startX = numVal('startX', 0);
  const startY = numVal('startY', 0);
  const col    = Math.floor((cx - startX) / size);
  const row    = Math.floor((cy - startY) / size);
  if (col >= 0 && col < xCount && row >= 0 && row < yCount) {
    showCtxMenu(e.clientX, e.clientY, col, row);
  }
});

document.addEventListener('click', hideCtxMenu);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { hideCtxMenu(); closeModal(); }
});

// ─── subdivide modal ───────────────────────────────────────
const subdivideModal = document.getElementById('subdivideModal');

function openModal(col, row) {
  document.getElementById('modalCellInfo').textContent = `欄 ${col + 1} / 列 ${row + 1}`;
  const sg = subGrids.get(`${col},${row}`);
  if (sg) {
    document.getElementById('subXCount').value            = sg.xCount;
    document.getElementById('subYCount').value            = sg.yCount;
    document.getElementById('subBorderWidth').value       = sg.bw;
    document.getElementById('subBorderColor').value       = sg.bColor;
    document.getElementById('subBorderOpacity').value     = Math.round(sg.bOpacity * 100);
    document.getElementById('subBorderOpacityVal').textContent = Math.round(sg.bOpacity * 100);
    document.getElementById('subFillColor').value         = sg.fColor;
    document.getElementById('subFillOpacity').value       = Math.round(sg.fOpacity * 100);
    document.getElementById('subFillOpacityVal').textContent   = Math.round(sg.fOpacity * 100);
  } else {
    // reset to defaults
    document.getElementById('subXCount').value            = 3;
    document.getElementById('subYCount').value            = 3;
    document.getElementById('subBorderWidth').value       = 1;
    document.getElementById('subBorderColor').value       = '#ffffff';
    document.getElementById('subBorderOpacity').value     = 80;
    document.getElementById('subBorderOpacityVal').textContent = 80;
    document.getElementById('subFillColor').value         = '#ffffff';
    document.getElementById('subFillOpacity').value       = 0;
    document.getElementById('subFillOpacityVal').textContent   = 0;
  }
  subdivideModal.style.display = 'flex';
}

function closeModal() { subdivideModal.style.display = 'none'; }

document.getElementById('ctxSubdivide').addEventListener('click', () => {
  hideCtxMenu();
  openModal(ctxCol, ctxRow);
});

document.getElementById('ctxClear').addEventListener('click', () => {
  hideCtxMenu();
  subGrids.delete(`${ctxCol},${ctxRow}`);
  render();
});

document.getElementById('modalClose').addEventListener('click',  closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
subdivideModal.addEventListener('click', (e) => { if (e.target === subdivideModal) closeModal(); });

document.getElementById('modalApply').addEventListener('click', () => {
  subGrids.set(`${ctxCol},${ctxRow}`, {
    xCount:   Math.max(1, parseInt(document.getElementById('subXCount').value)   || 1),
    yCount:   Math.max(1, parseInt(document.getElementById('subYCount').value)   || 1),
    bw:       Math.max(0, parseFloat(document.getElementById('subBorderWidth').value) || 0),
    bColor:   document.getElementById('subBorderColor').value,
    bOpacity: parseInt(document.getElementById('subBorderOpacity').value) / 100,
    fColor:   document.getElementById('subFillColor').value,
    fOpacity: parseInt(document.getElementById('subFillOpacity').value)  / 100,
  });
  closeModal();
  render();
});

document.getElementById('subBorderOpacity').addEventListener('input', function() {
  document.getElementById('subBorderOpacityVal').textContent = this.value;
});
document.getElementById('subFillOpacity').addEventListener('input', function() {
  document.getElementById('subFillOpacityVal').textContent = this.value;
});

// ─── draw sub-grid ─────────────────────────────────────────
function drawSubGrid(cellX, cellY, cellSize, sg) {
  const subW = cellSize / sg.xCount;
  const subH = cellSize / sg.yCount;
  const [br, bg, bb] = hexToRgb(sg.bColor);
  const [fr, fg, fb] = hexToRgb(sg.fColor);

  for (let r = 0; r < sg.yCount; r++) {
    for (let c = 0; c < sg.xCount; c++) {
      const x = cellX + c * subW;
      const y = cellY + r * subH;

      if (sg.fOpacity > 0) {
        ctx.fillStyle = `rgba(${fr},${fg},${fb},${sg.fOpacity})`;
        ctx.fillRect(x, y, subW, subH);
      }

      if (sg.bw > 0 && sg.bOpacity > 0) {
        ctx.strokeStyle = `rgba(${br},${bg},${bb},${sg.bOpacity})`;
        ctx.lineWidth   = sg.bw;
        ctx.strokeRect(
          x + sg.bw / 2,
          y + sg.bw / 2,
          subW - sg.bw,
          subH - sg.bw
        );
      }
    }
  }
}

// ─── helpers ───────────────────────────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return [r, g, b];
}

function val(id)      { return document.getElementById(id).value; }
function numVal(id, fallback=0) { return parseFloat(val(id)) || fallback; }

// ─── canvas mode helpers ───────────────────────────────────
function getEffectiveDpi() {
  const sel = document.getElementById('canvasDpi').value;
  return sel === 'custom'
    ? (parseFloat(document.getElementById('customDpiVal').value) || 96)
    : parseFloat(sel);
}

function updateCanvasPxBadge() {
  const wCm = parseFloat(document.getElementById('canvasW').value) || 21;
  const hCm = parseFloat(document.getElementById('canvasH').value) || 29.7;
  const dpi = getEffectiveDpi();
  const wp  = Math.max(1, Math.round(wCm * dpi / 2.54));
  const hp  = Math.max(1, Math.round(hCm * dpi / 2.54));
  document.getElementById('canvasPxBadge').textContent = `${wp} × ${hp} px`;
}

function drawImageOnCanvas(fitMode, offsetX, offsetY, imgPct) {
  const cw = canvas.width, ch = canvas.height;
  const iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;
  let dx, dy, dw, dh;
  const ox = offsetX || 0, oy = offsetY || 0;
  const pct = (imgPct || 100) / 100;

  switch (fitMode) {
    case 'fit': {
      const s = Math.min(cw / iw, ch / ih) * pct;
      dw = iw * s; dh = ih * s;
      dx = (cw - dw) / 2 + ox; dy = (ch - dh) / 2 + oy;
      ctx.drawImage(imgEl, dx, dy, dw, dh);
      break;
    }
    case 'fill': {
      const s = Math.max(cw / iw, ch / ih) * pct;
      dw = iw * s; dh = ih * s;
      dx = (cw - dw) / 2 + ox; dy = (ch - dh) / 2 + oy;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, cw, ch); ctx.clip();
      ctx.drawImage(imgEl, dx, dy, dw, dh);
      ctx.restore();
      break;
    }
    case 'stretch': {
      dw = cw * pct; dh = ch * pct;
      dx = (cw - dw) / 2 + ox; dy = (ch - dh) / 2 + oy;
      ctx.drawImage(imgEl, dx, dy, dw, dh);
      break;
    }
    case 'original': {
      dw = iw * pct; dh = ih * pct;
      dx = (cw - dw) / 2 + ox; dy = (ch - dh) / 2 + oy;
      ctx.drawImage(imgEl, dx, dy, dw, dh);
      break;
    }
  }
}

// ─── main render ───────────────────────────────────────────
function render() {
  if (!imgEl) return;

  const size        = Math.max(1, numVal('size', 60));
  const xCount      = Math.max(1, Math.round(numVal('xCount', 5)));
  const yCount      = Math.max(1, Math.round(numVal('yCount', 5)));
  const bw          = Math.max(0, numVal('borderWidth', 2));
  const bColor      = val('borderColor');
  const bOpacity    = numVal('borderOpacity', 100) / 100;
  const fColor      = val('fillColor');
  const fOpacity    = numVal('fillOpacity', 20) / 100;
  const startX      = numVal('startX', 0);
  const startY      = numVal('startY', 0);

  const canvasMode = document.getElementById('canvasModeOn').checked;

  if (canvasMode) {
    const wCm = parseFloat(document.getElementById('canvasW').value) || 21;
    const hCm = parseFloat(document.getElementById('canvasH').value) || 29.7;
    const dpi = getEffectiveDpi();
    canvas.width  = Math.max(1, Math.round(wCm * dpi / 2.54));
    canvas.height = Math.max(1, Math.round(hCm * dpi / 2.54));
    ctx.fillStyle = document.getElementById('canvasBg').value;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const offX   = parseFloat(document.getElementById('canvasOffsetX').value)   || 0;
    const offY   = parseFloat(document.getElementById('canvasOffsetY').value)   || 0;
    const imgPct = parseFloat(document.getElementById('canvasImgScale').value)  || 100;
    drawImageOnCanvas(document.getElementById('canvasFit').value, offX, offY, imgPct);
    sizeInfo.textContent = `${canvas.width} × ${canvas.height} px（畫布）`;
    updateCanvasPxBadge();
  } else {
    canvas.width  = imgEl.naturalWidth;
    canvas.height = imgEl.naturalHeight;
    ctx.drawImage(imgEl, 0, 0);
    sizeInfo.textContent = `${imgEl.naturalWidth} × ${imgEl.naturalHeight} px`;
  }

  // binarize (applied before drawing the grid)
  if (document.getElementById('binarizeOn').checked) {
    const threshold = numVal('threshold', 128);
    const method    = val('grayMethod');
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d         = imageData.data;
    for (let i = 0; i < d.length; i += 4) {
      let gray;
      if (method === 'luma') {
        gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
      } else if (method === 'avg') {
        gray = (d[i] + d[i+1] + d[i+2]) / 3;
      } else {
        gray = Math.max(d[i], d[i+1], d[i+2]);
      }
      const v = gray >= threshold ? 255 : 0;
      d[i] = d[i+1] = d[i+2] = v;
    }
    ctx.putImageData(imageData, 0, 0);
  }

  const [br, bg, bb] = hexToRgb(bColor);
  const [fr, fg, fb] = hexToRgb(fColor);

  for (let row = 0; row < yCount; row++) {
    for (let col = 0; col < xCount; col++) {
      const x = startX + col * size;
      const y = startY + row * size;

      // fill
      if (fOpacity > 0) {
        ctx.fillStyle = `rgba(${fr},${fg},${fb},${fOpacity})`;
        ctx.fillRect(x, y, size, size);
      }

      // border (drawn inside the square boundary)
      if (bw > 0 && bOpacity > 0) {
        ctx.strokeStyle = `rgba(${br},${bg},${bb},${bOpacity})`;
        ctx.lineWidth   = bw;
        ctx.strokeRect(
          x + bw / 2,
          y + bw / 2,
          size - bw,
          size - bw
        );
      }
    }
  }

  // draw sub-grids
  subGrids.forEach((sg, key) => {
    const [c, r] = key.split(',').map(Number);
    if (c < xCount && r < yCount) {
      drawSubGrid(startX + c * size, startY + r * size, size, sg);
    }
  });

  gridBadge.textContent = `${xCount} × ${yCount} = ${xCount * yCount} 格`;
  gridBadge.style.display = '';
  applyZoom();
}

// ─── load image ────────────────────────────────────────────
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      imgEl = img;
      canvas.style.display = 'block';
      placeholder.style.display = 'none';
      downloadBtn.disabled = false;
      zoomControls.style.display = 'flex';
      document.getElementById('autoFitBtn').disabled = false;
      uploadText.textContent = file.name;
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

document.getElementById('fileInput').addEventListener('change', e => loadFile(e.target.files[0]));

// drag & drop
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('drag-over');
  loadFile(e.dataTransfer.files[0]);
});

// ─── live inputs ───────────────────────────────────────────
const inputIds = ['size','xCount','yCount','borderWidth','borderColor','borderOpacity',
                  'fillColor','fillOpacity','startX','startY','threshold','grayMethod'];

inputIds.forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

// opacity labels
document.getElementById('borderOpacity').addEventListener('input', function() {
  document.getElementById('borderOpacityVal').textContent = this.value;
});
document.getElementById('fillOpacity').addEventListener('input', function() {
  document.getElementById('fillOpacityVal').textContent = this.value;
});

// threshold label
document.getElementById('threshold').addEventListener('input', function() {
  document.getElementById('thresholdVal').textContent = this.value;
});

// binarize toggle — show/hide options
document.getElementById('binarizeOn').addEventListener('change', function() {
  document.getElementById('binarizeOpts').style.display = this.checked ? 'flex' : 'none';
  render();
});

// ─── download ──────────────────────────────────────────────
downloadBtn.addEventListener('click', () => {
  if (!imgEl) return;
  const a = document.createElement('a');
  a.download = 'grid-overlay.png';
